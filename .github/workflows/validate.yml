name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install validation tools
        run: pip install ruff
      - name: Ruff
        run: |
          ruff check custom_components tests
          ruff format --check custom_components tests
      - name: Validate JSON
        run: python -m json.tool custom_components/getmymeter/manifest.json >/dev/null && python -m json.tool custom_components/getmymeter/strings.json >/dev/null && python -m json.tool hacs.json >/dev/null
