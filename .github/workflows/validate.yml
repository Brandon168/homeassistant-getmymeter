name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
      - name: Install exact Home Assistant test harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "homeassistant==2026.8.3" \
            "pytest-homeassistant-custom-component==0.13.357" \
            "pytest==9.0.3" \
            "pytest-asyncio==1.4.0" \
            "ruff==0.16.4"
      - name: Ruff check
        run: ruff check custom_components tests
      - name: Ruff format
        run: ruff format --check custom_components tests
      - name: JSON and translation validation
        run: |
          python -m json.tool custom_components/getmymeter/manifest.json >/dev/null
          python -m json.tool custom_components/getmymeter/strings.json >/dev/null
          python -m json.tool custom_components/getmymeter/translations/en.json >/dev/null
          python -m json.tool hacs.json >/dev/null
          cmp --silent custom_components/getmymeter/strings.json custom_components/getmymeter/translations/en.json
      - name: Synthetic test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m pytest -q -p no:cacheprovider

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
